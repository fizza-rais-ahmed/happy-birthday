<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Her Majesty's Birthday 👑</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>

:root{
--wine:#300b20;
--wine2:#52172f;
--gold:#d7b36a;
--lightgold:#f4dfae;
--cream:#fff5e9;
--rose:#eab7c8;
--pink:#f7dce5;
--lavender:#d9c9fa;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
min-height:100vh;
overflow-x:hidden;
background:#180b18;
color:var(--cream);
font-family:'Cormorant Garamond',serif;
}

button{
font-family:inherit;
}

#fireworks{
position:fixed;
inset:0;
width:100%;
height:100%;
pointer-events:none;
z-index:20;
}

#petalLayer{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:15;
}

.page{
position:relative;
min-height:100vh;
overflow:hidden;
}

.hidden{
display:none!important;
}

.center{
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.gold-text{
color:var(--gold);
}

.script{
font-family:'Great Vibes',cursive;
font-weight:400;
}

.serif{
font-family:'Playfair Display',serif;
}

.letter-spacing{
letter-spacing:5px;
}

.eyebrow{
font-size:11px;
letter-spacing:6px;
text-transform:uppercase;
color:var(--gold);
}

.gold-line{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin:20px auto;
color:var(--gold);
}

.gold-line:before,
.gold-line:after{
content:"";
width:55px;
height:1px;
background:var(--gold);
}

/* =================================
PAGE 1: ROYAL INVITATION
================================= */

#invitation{
background:
radial-gradient(ellipse at center,#673149,#2c1024 65%,#140912);
padding:35px 18px;
}

.invitation-frame{
width:min(510px,95%);
min-height:690px;
padding:45px 24px;
margin:auto;
border:1px solid #d7b36a99;
outline:1px solid #d7b36a44;
outline-offset:-9px;
background:
linear-gradient(145deg,#ffffff08,#ffffff02);
box-shadow:0 0 70px #0008;
position:relative;
}

.invitation-frame:before,
.invitation-frame:after{
content:"✦";
position:absolute;
color:var(--gold);
font-size:23px;
}

.invitation-frame:before{
top:18px;
left:22px;
}

.invitation-frame:after{
bottom:18px;
right:22px;
}

.crown{
font-size:48px;
color:var(--gold);
text-shadow:0 0 25px #e8bd7188;
margin-bottom:15px;
}

.invitation-title{
font-size:clamp(45px,10vw,75px);
color:var(--lightgold);
line-height:1.2;
margin:20px 0;
}

.invitation-subtitle{
color:#f0d4d9;
font-size:21px;
line-height:1.7;
}

.envelope-scene{
position:relative;
width:280px;
height:190px;
margin:65px auto 45px;
perspective:1000px;
}

.envelope-body{
position:absolute;
bottom:0;
width:100%;
height:155px;
background:#f4dfca;
border:2px solid var(--gold);
box-shadow:0 15px 40px #0008;
overflow:hidden;
}

.envelope-body:before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(35deg,transparent 49%,#d8b9a9 50%,transparent 51%),
linear-gradient(-35deg,transparent 49%,#e4c4b8 50%,transparent 51%);
}

.envelope-flap{
position:absolute;
top:35px;
left:0;
width:0;
height:0;
border-left:140px solid transparent;
border-right:140px solid transparent;
border-top:100px solid #f9e9d8;
transform-origin:top;
transition:transform 1s ease;
z-index:5;
filter:drop-shadow(0 3px 2px #0002);
}

.envelope-letter{
position:absolute;
bottom:15px;
left:12px;
right:12px;
height:130px;
padding:20px 5px;
background:#fff9ef;
color:#4b2336;
font-family:'Great Vibes',cursive;
font-size:28px;
transition:transform 1s ease;
z-index:2;
}

.envelope-scene.open .envelope-flap{
transform:rotateX(180deg);
}

.envelope-scene.open .envelope-letter{
transform:translateY(-105px);
}

.wax-seal{
position:absolute;
top:90px;
left:50%;
transform:translateX(-50%);
width:76px;
height:76px;
border-radius:50%;
border:4px double #f9dfaa;
background:
radial-gradient(circle at 35% 30%,#f4d48e,#a66d2c 75%);
box-shadow:
0 0 20px #e8c27a88,
inset 0 0 10px #fff7;
color:#fff0cb;
font-size:30px;
cursor:pointer;
z-index:10;
transition:.4s;
}

.wax-seal:hover{
transform:translateX(-50%) scale(1.13) rotate(12deg);
}

.wax-seal.used{
opacity:0;
pointer-events:none;
transform:translateX(-50%) scale(2);
}

.invitation-hint{
color:#edc8d7;
font-size:17px;
animation:glow 2s infinite;
}

@keyframes glow{
50%{
opacity:.5;
text-shadow:0 0 15px #fff;
}
}

/* =================================
BUTTON DESIGN
================================= */

.royal-button{
padding:15px 30px;
margin:12px;
border:1px solid var(--gold);
border-radius:2px;
background:linear-gradient(120deg,#f6dfb6,#f4c9d6);
color:#42172e;
font-size:17px;
font-weight:600;
letter-spacing:2px;
cursor:pointer;
box-shadow:0 8px 25px #0004;
transition:.3s;
}

.royal-button:hover{
transform:translateY(-5px);
box-shadow:0 12px 30px #e8b6c655;
}

.royal-button:disabled{
opacity:.5;
cursor:wait;
}

/* =================================
PAGE 2: GRAND PALACE ENTRANCE
================================= */

#palace{
background:
radial-gradient(ellipse at 50% 0%,#71334e,transparent 60%),
linear-gradient(180deg,#351226,#170a18);
padding:50px 20px;
text-align:center;
}

.palace-content{
min-height:90vh;
justify-content:center;
}

.palace-crown{
font-size:90px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
50%{transform:translateY(-15px)}
}

.palace-name{
font-size:clamp(55px,13vw,100px);
color:var(--lightgold);
text-shadow:0 0 35px #d7b36a88;
margin:20px 0;
}

.palace-subtitle{
font-size:24px;
color:#f6dbe5;
line-height:1.8;
}

.palace-divider{
width:180px;
height:1px;
background:linear-gradient(90deg,transparent,var(--gold),transparent);
margin:30px auto;
}

/* =================================
ROYAL CARDS
================================= */

.royal-card{
width:min(570px,95%);
margin:30px auto;
padding:35px 24px;
background:
linear-gradient(145deg,#ffffff13,#ffffff04);
border:1px solid #d7b36a88;
box-shadow:0 20px 65px #0005;
position:relative;
}

.royal-card:after{
content:"";
position:absolute;
inset:7px;
border:1px solid #d7b36a33;
pointer-events:none;
}

.card-title{
font-family:'Playfair Display',serif;
font-size:clamp(32px,7vw,48px);
color:var(--lightgold);
margin:20px 0;
}

.fade-in{
animation:fadeIn 1s ease both;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* =================================
PAGE 3: ROYAL CHALLENGES
================================= */

.challenge-page{
min-height:100vh;
padding:45px 18px;
background:
radial-gradient(ellipse at top,#663148,transparent 65%),
#1d0b1a;
text-align:center;
}

.challenge-icon{
font-size:75px;
margin-bottom:20px;
}

.challenge-text{
font-size:21px;
line-height:1.8;
color:#f7e5e9;
}

#escapeButton{
position:relative;
}

/* =================================
PAGE 4: LOVE LETTER
================================= */

#loveLetter{
min-height:100vh;
padding:55px 18px;
background:
radial-gradient(ellipse at top,#684052,#291126 70%);
text-align:center;
}

.paper{
max-width:680px;
margin:30px auto;
padding:40px 27px;
background:
linear-gradient(135deg,#fff9ef,#f3e4d5);
color:#59394a;
border:5px double #c49c5b;
box-shadow:0 20px 70px #0008;
text-align:left;
position:relative;
}

.paper:before{
content:"";
position:absolute;
inset:9px;
border:1px solid #c49c5b66;
pointer-events:none;
}

.paper-heading{
font-family:'Great Vibes',cursive;
font-size:43px;
color:#9c526c;
text-align:center;
margin:20px 0;
}

.paper-content{
font-size:20px;
line-height:2;
white-space:pre-line;
}

.signature{
font-family:'Great Vibes',cursive;
font-size:40px;
color:#9c526c;
text-align:right;
margin-top:25px;
}

/* =================================
FALLING PETALS
================================= */

.falling-petal{
position:absolute;
top:-50px;
animation:fall linear forwards;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

/* =================================
MOBILE
================================= */

@media(max-width:500px){

.invitation-frame{
min-height:650px;
padding:35px 15px;
}

.envelope-scene{
transform:scale(.9);
margin:45px auto;
}

.paper{
padding:32px 19px;
}

.paper-content{
font-size:18px;
}

.royal-button{
padding:13px 20px;
font-size:15px;
}

}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>
<div id="petalLayer"></div>

<!-- PAGE 1: ROYAL INVITATION -->

<section id="invitation" class="page center">

<div class="invitation-frame center">

<div class="crown">♛</div>

<p class="eyebrow">THE ROYAL COURT CORDIALLY INVITES YOU</p>

<h1 class="invitation-title script">
A Birthday Fairytale
</h1>

<div class="gold-line">✦</div>

<p class="invitation-subtitle">
A special celebration awaits<br>
someone extraordinary.
</p>

<h2 id="invitationName"
class="script gold-text"
style="font-size:48px;margin-top:18px">
My Beautiful Girl
</h2>

<div class="envelope-scene" id="envelope">

<div class="envelope-body"></div>

<div class="envelope-letter">
A royal surprise awaits...
<div style="font-size:18px">Sealed with love ♡</div>
</div>

<div class="envelope-flap"></div>

<button class="wax-seal"
id="waxSeal"
onclick="openInvitation()">
♛
</button>

</div>

<p class="invitation-hint" id="sealHint">
✨ Click the golden seal to discover your surprise ✨
</p>

<div id="invitationContinue" class="hidden">
<button class="royal-button"
onclick="enterPalace()">
ENTER THE ROYAL WORLD ♡
</button>
</div>

<div class="gold-line">✦ ♛ ✦</div>

<p class="eyebrow">ONE NIGHT. A THOUSAND BEAUTIFUL WISHES.</p>

</div>

</section>

<!-- PART 2 WILL CONTINUE HERE -->

</body>
</html>
